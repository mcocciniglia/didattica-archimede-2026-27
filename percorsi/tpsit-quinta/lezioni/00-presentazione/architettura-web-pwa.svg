<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Architettura di un servizio Web con PWA</title>
  <desc id="desc">Il client Web, eventualmente installato come PWA, invia una richiesta HTTP con dati JSON all'API esposta dal server Flask. Il server elabora la richiesta e restituisce una risposta HTTP JSON allo stesso client.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 11 6 1 11Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 11 6 1 11Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="30" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="750" fill="#0f172a">Dal client Web al servizio</text>
  <text x="600" y="93" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">La PWA è il client; l’API è l’ingresso del server</text>

  <!-- Client side -->
  <g filter="url(#shadow)">
    <rect x="62" y="128" width="385" height="318" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
  </g>
  <rect x="88" y="151" width="126" height="34" rx="17" fill="#dbeafe"/>
  <text x="151" y="174" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="750" fill="#1e3a8a">LATO CLIENT</text>

  <rect x="105" y="207" width="118" height="82" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <rect x="119" y="224" width="90" height="46" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="130" cy="235" r="3.5" fill="#2563eb"/>
  <line x1="143" y1="235" x2="196" y2="235" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <line x1="132" y1="250" x2="195" y2="250" stroke="#dbeafe" stroke-width="6" stroke-linecap="round"/>

  <text x="246" y="226" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="750" fill="#0f172a">Client Web / PWA</text>
  <text x="246" y="255" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">HTML, CSS e JavaScript</text>
  <text x="246" y="281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">nel browser o sul dispositivo</text>

  <rect x="105" y="322" width="300" height="48" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="255" y="351" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#1d4ed8">Service worker · cache · interfaccia</text>
  <text x="255" y="410" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b">La PWA non viene “dopo” il server:</text>
  <text x="255" y="432" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#334155">è una modalità del client Web.</text>

  <!-- Server side -->
  <g filter="url(#shadow)">
    <rect x="753" y="128" width="385" height="318" rx="28" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
  </g>
  <rect x="779" y="151" width="132" height="34" rx="17" fill="#dcfce7"/>
  <text x="845" y="174" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="750" fill="#14532d">LATO SERVER</text>

  <g transform="translate(797 207)">
    <rect width="118" height="35" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <circle cx="18" cy="17.5" r="5" fill="#16a34a"/>
    <line x1="35" y1="17.5" x2="94" y2="17.5" stroke="#86efac" stroke-width="5" stroke-linecap="round"/>
    <rect y="45" width="118" height="35" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <circle cx="18" cy="62.5" r="5" fill="#16a34a"/>
    <line x1="35" y1="62.5" x2="94" y2="62.5" stroke="#86efac" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="936" y="226" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="750" fill="#0f172a">Server Flask</text>
  <text x="936" y="255" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Riceve ed elabora</text>
  <text x="936" y="281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">le richieste del client</text>

  <rect x="797" y="322" width="300" height="48" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="947" y="351" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#15803d">API HTTP/JSON · logica · controlli</text>
  <text x="947" y="410" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b">L’API non è un computer separato:</text>
  <text x="947" y="432" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#334155">è l’interfaccia esposta dal server.</text>

  <!-- Network and message exchange -->
  <circle cx="600" cy="287" r="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M574 292c0-12 10-22 22-22 5-15 27-16 34-3 12-1 22 8 22 19 0 12-10 21-22 21h-36c-11 0-20-7-20-15Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="330" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">RETE</text>

  <path d="M458 214 C530 167 670 167 742 214" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <rect x="493" y="132" width="214" height="52" rx="26" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="600" y="154" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" fill="#1e3a8a">RICHIESTA HTTP</text>
  <text x="600" y="174" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#1d4ed8">eventuali dati JSON</text>

  <path d="M742 365 C670 413 530 413 458 365" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <rect x="493" y="392" width="214" height="52" rx="26" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="600" y="414" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" fill="#14532d">RISPOSTA HTTP</text>
  <text x="600" y="434" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#15803d">dati o esito in JSON</text>

  <text x="600" y="518" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" fill="#334155">Il client usa l’API del server attraverso uno scambio di richieste e risposte.</text>
</svg>
