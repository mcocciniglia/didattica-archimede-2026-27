<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Come collaborano un'applicazione Web e un server</title>
  <desc id="desc">A sinistra un'applicazione Web, che può essere una PWA e usare risorse salvate quando è offline. A destra un servizio Web. Attraverso la rete il client invia una richiesta secondo le regole dell'API e il server restituisce una risposta.</desc>

  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 18px; fill: #475569; }
      .badge { font-size: 15px; font-weight: 750; letter-spacing: .4px; }
      .heading { font-size: 27px; font-weight: 750; }
      .body { font-size: 17px; fill: #334155; }
      .small { font-size: 15px; fill: #475569; }
      .label { font-size: 16px; font-weight: 750; }
      .arrow-label { font-size: 15px; font-weight: 750; }
      .arrow-sub { font-size: 14px; }
      .footer { font-size: 18px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="28" fill="#f8fafc"/>

  <text x="600" y="52" text-anchor="middle" class="title">Come collaborano un'applicazione Web e un server</text>
  <text x="600" y="82" text-anchor="middle" class="subtitle">Il client formula una richiesta; il server la elabora e restituisce una risposta.</text>

  <!-- Lato client -->
  <g filter="url(#shadow)">
    <rect x="48" y="118" width="438" height="424" rx="26" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
  </g>
  <rect x="76" y="142" width="126" height="34" rx="17" fill="#dbeafe"/>
  <text x="139" y="165" text-anchor="middle" class="badge" fill="#1e40af">LATO CLIENT</text>

  <!-- Icona browser -->
  <rect x="78" y="199" width="118" height="80" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <line x1="78" y1="222" x2="196" y2="222" stroke="#2563eb" stroke-width="3"/>
  <circle cx="92" cy="211" r="4" fill="#2563eb"/>
  <circle cx="106" cy="211" r="4" fill="#60a5fa"/>
  <line x1="96" y1="239" x2="174" y2="239" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <line x1="96" y1="255" x2="157" y2="255" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/>

  <text x="218" y="222" class="heading">Applicazione Web</text>
  <text x="218" y="251" class="body">Mostra l'interfaccia e</text>
  <text x="218" y="276" class="body">raccoglie le azioni dell'utente.</text>

  <rect x="78" y="309" width="378" height="132" rx="17" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="105" cy="337" r="13" fill="#2563eb"/>
  <path d="M99 337h12M105 331v12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="128" y="343" class="label" fill="#1d4ed8">Può essere una PWA</text>
  <text x="98" y="374" class="body">Un'applicazione Web installabile, capace</text>
  <text x="98" y="400" class="body">di usare risorse salvate e funzioni offline.</text>
  <text x="98" y="426" class="small">Rimane comunque un'applicazione Web.</text>

  <rect x="78" y="461" width="378" height="55" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <path d="M101 489a12 12 0 1 1 18 10M119 499h-8v-8" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="134" y="484" class="small">Senza rete usa soltanto risorse e dati</text>
  <text x="134" y="505" class="small">già salvati sul dispositivo.</text>

  <!-- Lato server -->
  <g filter="url(#shadow)">
    <rect x="714" y="118" width="438" height="424" rx="26" fill="#ffffff" stroke="#86efac" stroke-width="3"/>
  </g>
  <rect x="742" y="142" width="132" height="34" rx="17" fill="#dcfce7"/>
  <text x="808" y="165" text-anchor="middle" class="badge" fill="#166534">LATO SERVER</text>

  <!-- Icona server -->
  <rect x="744" y="201" width="118" height="40" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <circle cx="760" cy="221" r="5" fill="#16a34a"/>
  <line x1="776" y1="221" x2="840" y2="221" stroke="#86efac" stroke-width="5" stroke-linecap="round"/>
  <rect x="744" y="251" width="118" height="40" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <circle cx="760" cy="271" r="5" fill="#16a34a"/>
  <line x1="776" y1="271" x2="840" y2="271" stroke="#86efac" stroke-width="5" stroke-linecap="round"/>

  <text x="884" y="222" class="heading">Servizio Web</text>
  <text x="884" y="251" class="body">Riceve la richiesta,</text>
  <text x="884" y="276" class="body">la elabora e risponde.</text>

  <rect x="744" y="320" width="378" height="121" rx="17" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <rect x="764" y="341" width="62" height="33" rx="9" fill="#16a34a"/>
  <text x="795" y="364" text-anchor="middle" class="label" fill="#ffffff">API</text>
  <text x="844" y="351" class="label" fill="#166534">Le regole del dialogo</text>
  <text x="764" y="397" class="body">Indica quali richieste sono possibili</text>
  <text x="764" y="423" class="body">e come sarà costruita la risposta.</text>

  <rect x="744" y="461" width="378" height="55" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="773" cy="488" r="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <path d="M768 488l4 4 7-9" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="797" y="484" class="small">Le operazioni che richiedono il server</text>
  <text x="797" y="505" class="small">hanno bisogno della connessione.</text>

  <!-- Rete e scambio -->
  <path d="M470 211 C550 163 641 163 724 211" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <rect x="507" y="125" width="186" height="63" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="600" y="151" text-anchor="middle" class="arrow-label" fill="#1d4ed8">RICHIESTA</text>
  <text x="600" y="174" text-anchor="middle" class="arrow-sub" fill="#1d4ed8">Che cosa chiede il client?</text>

  <g transform="translate(600 301)">
    <circle r="52" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M-29 7c0-13 10-23 23-23 3-12 14-20 27-20 16 0 29 12 31 27 11 2 19 11 19 22 0 13-10 23-23 23h-53c-13 0-24-10-24-23 0-2 0-4 0-6z" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="72" text-anchor="middle" class="badge" fill="#475569">RETE</text>
  </g>

  <path d="M730 416 C646 465 554 465 470 416" fill="none" stroke="#15803d" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="500" y="438" width="200" height="63" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="600" y="464" text-anchor="middle" class="arrow-label" fill="#166534">RISPOSTA</text>
  <text x="600" y="487" text-anchor="middle" class="arrow-sub" fill="#166534">Quale risultato restituisce?</text>

  <!-- Sintesi -->
  <rect x="118" y="573" width="964" height="49" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="151" cy="598" r="8" fill="#2563eb"/>
  <text x="171" y="604" class="footer">PWA: un tipo di applicazione Web</text>
  <line x1="564" y1="585" x2="564" y2="611" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="599" cy="598" r="8" fill="#16a34a"/>
  <text x="619" y="604" class="footer">API: le regole con cui i programmi comunicano</text>
</svg>
