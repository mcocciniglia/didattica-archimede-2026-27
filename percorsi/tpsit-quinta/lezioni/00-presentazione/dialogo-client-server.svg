<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Il dialogo tra client e server</title>
  <desc id="desc">Il client invia una richiesta al server. Il server elabora la richiesta e restituisce una risposta allo stesso client.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 11 6 1 11Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 11 6 1 11Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="30" fill="#f8fafc"/>

  <text x="600" y="62" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="750" fill="#0f172a">Il dialogo client–server</text>
  <text x="600" y="98" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">La comunicazione avviene sempre in due direzioni</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="76" y="160" width="280" height="250" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <rect x="128" y="205" width="176" height="116" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
  <rect x="148" y="226" width="136" height="68" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="162" cy="239" r="4" fill="#2563eb"/>
  <line x1="181" y1="239" x2="264" y2="239" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"/>
  <line x1="165" y1="258" x2="267" y2="258" stroke="#dbeafe" stroke-width="7" stroke-linecap="round"/>
  <line x1="165" y1="277" x2="235" y2="277" stroke="#dbeafe" stroke-width="7" stroke-linecap="round"/>
  <path d="M184 322h64l9 18h-82Z" fill="#2563eb"/>
  <rect x="157" y="339" width="118" height="9" rx="4.5" fill="#1d4ed8"/>
  <text x="216" y="382" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="750" fill="#0f172a">CLIENT</text>
  <text x="216" y="405" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b">browser o applicazione</text>

  <!-- Server -->
  <g filter="url(#shadow)">
    <rect x="844" y="160" width="280" height="250" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <g transform="translate(905 202)">
    <rect width="158" height="42" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/>
    <circle cx="24" cy="21" r="6" fill="#16a34a"/>
    <circle cx="46" cy="21" r="6" fill="#86efac"/>
    <line x1="70" y1="21" x2="132" y2="21" stroke="#86efac" stroke-width="6" stroke-linecap="round"/>
    <rect y="54" width="158" height="42" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/>
    <circle cx="24" cy="75" r="6" fill="#16a34a"/>
    <circle cx="46" cy="75" r="6" fill="#86efac"/>
    <line x1="70" y1="75" x2="132" y2="75" stroke="#86efac" stroke-width="6" stroke-linecap="round"/>
    <rect y="108" width="158" height="42" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/>
    <circle cx="24" cy="129" r="6" fill="#16a34a"/>
    <circle cx="46" cy="129" r="6" fill="#86efac"/>
    <line x1="70" y1="129" x2="132" y2="129" stroke="#86efac" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="984" y="382" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="750" fill="#0f172a">SERVER</text>
  <text x="984" y="405" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b">riceve, elabora, risponde</text>

  <!-- Request: client to server -->
  <path d="M375 215 C520 130 680 130 825 215" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <rect x="475" y="125" width="250" height="58" rx="29" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="600" y="150" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">1 · RICHIESTA</text>
  <text x="600" y="172" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#1d4ed8">il client invia un messaggio</text>

  <!-- Response: server back to client -->
  <path d="M825 350 C680 455 520 455 375 350" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <rect x="475" y="382" width="250" height="58" rx="29" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="600" y="407" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">2 · RISPOSTA</text>
  <text x="600" y="429" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#15803d">il server risponde al client</text>

  <text x="600" y="491" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#334155">La risposta chiude il ciclo tornando al punto di partenza.</text>
</svg>
