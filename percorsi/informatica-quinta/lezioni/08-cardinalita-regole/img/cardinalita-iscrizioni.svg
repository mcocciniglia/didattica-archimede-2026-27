<title id="titolo">Cardinalità delle iscrizioni</title><desc id="descrizione">Partecipante e Attività sono collegati da si iscrive. La cardinalità vicino a ciascuna entità è zero, N. Data e conferma sono attributi dell'associazione.</desc>
