<title id="titolo">Partecipante si iscrive ad Attività</title>
<desc id="descrizione">Due rettangoli rappresentano le entità Partecipante e Attività. Un rombo centrale rappresenta l’associazione si iscrive. L’attributo data è collegato al rombo.</desc>
