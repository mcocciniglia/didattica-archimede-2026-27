<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Come si conta in base 26 usando le lettere</title>
  <desc id="desc">La sequenza procede da A, B e C fino a Z, che vale 25, poi BA, che vale 26, e BB. In basso sono confrontati 01 uguale 1 in decimale e AB uguale B in base 26.</desc>
  <rect width="1400" height="720" rx="28" fill="#f7f9fc"/>
  <text x="70" y="80" fill="#0d3569" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="44" font-weight="800">Come si conta in base 26</text>
  <text x="70" y="125" fill="#425466" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="25">A vale 0: dopo l’ultima cifra in una posizione ne aggiungiamo una a sinistra.</text>

  <g font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#0d3569" stroke-width="4">
      <rect x="70" y="185" width="130" height="110" rx="18"/>
      <rect x="260" y="185" width="130" height="110" rx="18"/>
      <rect x="450" y="185" width="130" height="110" rx="18"/>
      <rect x="650" y="185" width="130" height="110" rx="18"/>
    </g>
    <rect x="850" y="175" width="150" height="130" rx="20" fill="#fff0dd" stroke="#ad5708" stroke-width="5"/>
    <rect x="1070" y="175" width="150" height="130" rx="20" fill="#e5f4eb" stroke="#21734b" stroke-width="5"/>
    <rect x="1270" y="185" width="100" height="110" rx="18" fill="#ffffff" stroke="#0d3569" stroke-width="4"/>

    <g fill="#0d3569" font-size="44" font-weight="800">
      <text x="135" y="252">A</text>
      <text x="325" y="252">B</text>
      <text x="515" y="252">C</text>
      <text x="715" y="252">…</text>
      <text x="1320" y="252">BB</text>
    </g>
    <text x="925" y="235" fill="#7a3e05" font-size="42" font-weight="800">Z</text>
    <text x="925" y="278" fill="#7a3e05" font-size="24" font-weight="700">valore 25</text>
    <text x="1145" y="235" fill="#175b3b" font-size="42" font-weight="800">BA</text>
    <text x="1145" y="278" fill="#175b3b" font-size="24" font-weight="700">valore 26</text>

    <g fill="none" stroke="#5c7188" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M205 240 H245"/>
      <path d="M235 230 L248 240 L235 250"/>
      <path d="M395 240 H435"/>
      <path d="M425 230 L438 240 L425 250"/>
      <path d="M585 240 H635"/>
      <path d="M625 230 L638 240 L625 250"/>
      <path d="M785 240 H835"/>
      <path d="M825 230 L838 240 L825 250"/>
      <path d="M1005 240 H1055" stroke="#ad5708"/>
      <path d="M1045 230 L1058 240 L1045 250" stroke="#ad5708"/>
      <path d="M1225 240 H1255"/>
      <path d="M1245 230 L1258 240 L1245 250"/>
    </g>
  </g>

  <line x1="70" y1="365" x2="1330" y2="365" stroke="#c6d0dc" stroke-width="3"/>
  <text x="70" y="425" fill="#0d3569" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="32" font-weight="800">Gli zeri iniziali non cambiano il valore</text>

  <g font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">
    <rect x="70" y="465" width="570" height="170" rx="22" fill="#ffffff" stroke="#0d3569" stroke-width="4"/>
    <text x="110" y="515" fill="#425466" font-size="23" font-weight="700">DECIMALE</text>
    <text x="110" y="585" fill="#0d3569" font-size="52" font-weight="800">01 = 1</text>
    <text x="335" y="585" fill="#425466" font-size="21">0 iniziale: nessun contributo</text>

    <rect x="760" y="465" width="570" height="170" rx="22" fill="#ffffff" stroke="#ad5708" stroke-width="4"/>
    <text x="800" y="515" fill="#7a3e05" font-size="23" font-weight="700">BASE 26 CON A = 0</text>
    <text x="800" y="585" fill="#7a3e05" font-size="52" font-weight="800">AB = B</text>
    <text x="1035" y="585" fill="#425466" font-size="21">A iniziale: nessun contributo</text>
  </g>
  <text x="700" y="685" text-anchor="middle" fill="#425466" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="24">Forma breve: A, B, …, Z, BA · Forma con almeno due lettere: AA, AB, …, AZ, BA</text>
</svg>
