<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc"><title id="title">Mappa degli strumenti di Google Documenti</title><desc id="desc">Schema semplificato con nome del file, menu, stili, grassetto, allineamento e interlinea, commenti e condivisione.</desc><rect width="1120" height="500" rx="16" fill="#f4f7fb"/><g font-family="Segoe UI,Arial,sans-serif" fill="#142c49"><text x="30" y="44" font-size="24" font-weight="700">Google Documenti · schema per orientarsi</text><rect x="24" y="66" width="1072" height="132" rx="12" fill="#e4eefb" stroke="#517397"/><text x="44" y="103" font-size="23">① Nome del file: …Guida_laboratorio</text><text x="44" y="143" font-size="21">② File · Modifica · Inserisci · Formato · Strumenti</text><text x="44" y="180" font-size="20">③ Stili</text><text x="205" y="180" font-size="20" font-weight="700">④ Grassetto</text><text x="385" y="180" font-size="20">⑤ Allinea · Interlinea</text><rect x="788" y="80" width="288" height="48" rx="14" fill="#0d3569"/><text x="810" y="111" font-size="20" fill="#fff">⑥ Commenti · Condividi</text><rect x="100" y="222" width="680" height="248" fill="#fff" stroke="#517397"/><text x="136" y="266" font-size="26" font-weight="700">Una guida al laboratorio</text><text x="136" y="311" font-size="23" font-weight="700">Iniziare il lavoro</text><text x="136" y="350" font-size="21">Prima di iniziare, controlla la postazione.</text><text x="136" y="386" font-size="21">Se noti un danno, avvisa il docente.</text><rect x="810" y="264" width="266" height="144" rx="12" fill="#fff0dd" stroke="#ad5708"/><text x="832" y="300" font-size="21" font-weight="700">Un commento utile</text><text x="832" y="338" font-size="20">A quale controllo</text><text x="832" y="370" font-size="20">ti riferisci?</text></g></svg>