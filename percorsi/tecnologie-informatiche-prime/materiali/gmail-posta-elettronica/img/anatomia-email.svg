<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Anatomia di un’email</title>
  <desc id="desc">Finestra di composizione schematica con sette richiami numerati: A, CC e CCN, oggetto, corpo, allegato e Invia.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f6b95f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071a33" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#eaf2fc"/>
  <text x="60" y="64" fill="#0d3569" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="34" font-weight="800">Anatomia di un’email</text>
  <text x="60" y="100" fill="#41546d" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="21">Schema didattico di una finestra di composizione</text>

  <g filter="url(#shadow)">
    <rect x="250" y="130" width="700" height="555" rx="18" fill="#ffffff" stroke="#9db3cc" stroke-width="2"/>
    <path d="M268 130h664a18 18 0 0 1 18 18v58H250v-58a18 18 0 0 1 18-18z" fill="#0d3569"/>
    <text x="285" y="179" fill="#ffffff" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="25" font-weight="700">Nuovo messaggio</text>
    <circle cx="898" cy="168" r="6" fill="#d9e7f7"/><circle cx="922" cy="168" r="6" fill="#d9e7f7"/>

    <text x="282" y="246" fill="#52657a" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="22" font-weight="700">A</text>
    <text x="320" y="246" fill="#172b45" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="22">docente@scuola.example</text>
    <text x="824" y="246" fill="#0d5da8" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="20" font-weight="700">CC  CCN</text>
    <line x1="278" y1="270" x2="922" y2="270" stroke="#c5d3e2" stroke-width="2"/>

    <text x="282" y="314" fill="#52657a" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="22" font-weight="700">Oggetto</text>
    <text x="390" y="314" fill="#172b45" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="22">Chiarimento sull’esercizio 3</text>
    <line x1="278" y1="338" x2="922" y2="338" stroke="#c5d3e2" stroke-width="2"/>

    <text x="282" y="386" fill="#172b45" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="21">Buongiorno Professore,</text>
    <text x="282" y="426" fill="#172b45" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="21">sono Luca Bianchi della classe 1ª A.</text>
    <text x="282" y="466" fill="#172b45" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="21">Vorrei un chiarimento sul passaggio 2.</text>
    <text x="282" y="522" fill="#172b45" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="21">Cordiali saluti,</text>
    <text x="282" y="558" fill="#172b45" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="21">Luca Bianchi</text>

    <line x1="278" y1="590" x2="922" y2="590" stroke="#c5d3e2" stroke-width="2"/>
    <rect x="282" y="612" width="116" height="48" rx="12" fill="#1267b1"/>
    <text x="340" y="644" text-anchor="middle" fill="#ffffff" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="21" font-weight="800">Invia</text>
    <path d="M445 624v26M436 635l9-10 9 10M435 650h20" fill="none" stroke="#41546d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="470" y="643" fill="#41546d" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="19">Allega file</text>
  </g>

  <g font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">
    <circle cx="95" cy="228" r="25" fill="#0d3569"/><text x="95" y="237" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">1</text>
    <text x="132" y="218" fill="#0d3569" font-size="22" font-weight="800">A</text><text x="132" y="242" fill="#41546d" font-size="16">destinatario</text><text x="132" y="263" fill="#41546d" font-size="16">principale</text>
    <path d="M205 228H275" fill="none" stroke="#f6b95f" stroke-width="4" marker-end="url(#arrow)"/>

    <circle cx="1072" cy="217" r="25" fill="#0d3569"/><text x="1072" y="226" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">2</text>
    <text x="988" y="265" fill="#0d3569" font-size="20" font-weight="800">CC</text><text x="988" y="291" fill="#41546d" font-size="17">copia visibile</text>
    <path d="M1050 225L916 241" fill="none" stroke="#f6b95f" stroke-width="4" marker-end="url(#arrow)"/>

    <circle cx="1072" cy="338" r="25" fill="#0d3569"/><text x="1072" y="347" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">3</text>
    <text x="987" y="386" fill="#0d3569" font-size="20" font-weight="800">CCN</text><text x="987" y="412" fill="#41546d" font-size="17">copia nascosta</text>
    <path d="M1050 330L905 250" fill="none" stroke="#f6b95f" stroke-width="4" marker-end="url(#arrow)"/>

    <circle cx="100" cy="330" r="25" fill="#0d3569"/><text x="100" y="339" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">4</text>
    <text x="137" y="319" fill="#0d3569" font-size="21" font-weight="800">Oggetto</text><text x="137" y="343" fill="#41546d" font-size="16">motivo in breve</text>
    <path d="M224 329H365" fill="none" stroke="#f6b95f" stroke-width="4" marker-end="url(#arrow)"/>

    <circle cx="100" cy="442" r="25" fill="#0d3569"/><text x="100" y="451" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">5</text>
    <text x="137" y="428" fill="#0d3569" font-size="21" font-weight="800">Corpo</text><text x="137" y="452" fill="#41546d" font-size="16">testo del</text><text x="137" y="473" fill="#41546d" font-size="16">messaggio</text>
    <path d="M218 440H285" fill="none" stroke="#f6b95f" stroke-width="4" marker-end="url(#arrow)"/>

    <circle cx="1055" cy="587" r="25" fill="#0d3569"/><text x="1055" y="596" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">6</text>
    <text x="985" y="634" fill="#0d3569" font-size="20" font-weight="800">Allegato</text><text x="985" y="660" fill="#41546d" font-size="17">file aggiunto</text>
    <path d="M1032 580L470 628" fill="none" stroke="#f6b95f" stroke-width="4" marker-end="url(#arrow)"/>

    <circle cx="98" cy="635" r="25" fill="#0d3569"/><text x="98" y="644" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">7</text>
    <text x="134" y="621" fill="#0d3569" font-size="21" font-weight="800">Invia</text><text x="134" y="645" fill="#41546d" font-size="16">solo dopo</text><text x="134" y="666" fill="#41546d" font-size="16">il controllo</text>
    <path d="M215 638H282" fill="none" stroke="#f6b95f" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
