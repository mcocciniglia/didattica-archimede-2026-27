<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Rispondi e Rispondi a tutti</title>
  <desc id="desc">Un messaggio parte da uno studente e raggiunge un docente in A, un coordinatore in CC e un osservatore nascosto in CCN. Quando il docente risponde, Rispondi include solo lo studente; Rispondi a tutti include lo studente e il coordinatore, ma non il destinatario nascosto.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1267b1"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#071a33" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#edf4fc"/>
  <text x="60" y="62" fill="#0d3569" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="34" font-weight="800">Rispondi o Rispondi a tutti?</text>
  <text x="60" y="98" fill="#41546d" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif" font-size="21">Esempio: risponde il destinatario principale inserito in A.</text>

  <g filter="url(#shadow)" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">
    <rect x="60" y="130" width="1080" height="186" rx="20" fill="#ffffff" stroke="#9db3cc" stroke-width="2"/>
    <path d="M80 130h1040a20 20 0 0 1 20 20v42H60v-42a20 20 0 0 1 20-20z" fill="#0d3569"/>
    <path d="M91 151h34v25H91zM92 152l16 13 16-13" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="145" y="168" fill="#ffffff" font-size="23" font-weight="850">Messaggio iniziale</text>

    <rect x="88" y="216" width="190" height="70" rx="16" fill="#fff0dd" stroke="#ad5708" stroke-width="2"/>
    <circle cx="122" cy="251" r="22" fill="#f6b95f"/><text x="122" y="259" text-anchor="middle" fill="#0d3569" font-size="19" font-weight="900">M</text>
    <text x="156" y="245" fill="#7b3d05" font-size="20" font-weight="850">Studente</text>
    <text x="156" y="269" fill="#41546d" font-size="16">mittente</text>

    <rect x="354" y="216" width="220" height="70" rx="16" fill="#dcecff" stroke="#287bbf" stroke-width="2"/>
    <circle cx="388" cy="251" r="22" fill="#ffffff"/><text x="388" y="258" text-anchor="middle" fill="#0d3569" font-size="19" font-weight="900">A</text>
    <text x="422" y="245" fill="#0d3569" font-size="20" font-weight="850">Docente</text>
    <text x="422" y="269" fill="#41546d" font-size="16">risponderà</text>

    <rect x="620" y="216" width="220" height="70" rx="16" fill="#fff0dd" stroke="#ad5708" stroke-width="2"/>
    <circle cx="654" cy="251" r="22" fill="#ffffff"/><text x="654" y="258" text-anchor="middle" fill="#7b3d05" font-size="16" font-weight="900">CC</text>
    <text x="688" y="245" fill="#7b3d05" font-size="20" font-weight="850">Coordinatore</text>
    <text x="688" y="269" fill="#41546d" font-size="16">copia visibile</text>

    <rect x="886" y="216" width="220" height="70" rx="16" fill="#e5f4eb" stroke="#21734b" stroke-width="2"/>
    <circle cx="920" cy="251" r="22" fill="#ffffff"/><text x="920" y="258" text-anchor="middle" fill="#15573a" font-size="15" font-weight="900">CCN</text>
    <text x="954" y="245" fill="#15573a" font-size="20" font-weight="850">Osservatore</text>
    <text x="954" y="269" fill="#41546d" font-size="16">copia nascosta</text>
  </g>
  <path d="M278 251H344" fill="none" stroke="#1267b1" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">
    <rect x="60" y="360" width="510" height="270" rx="20" fill="#ffffff" stroke="#287bbf" stroke-width="3"/>
    <path d="M80 360h470a20 20 0 0 1 20 20v45H60v-45a20 20 0 0 1 20-20z" fill="#1267b1"/>
    <text x="94" y="401" fill="#ffffff" font-size="27" font-weight="850">Rispondi</text>
    <text x="94" y="464" fill="#0d3569" font-size="19" font-weight="800">Docente</text>
    <circle cx="225" cy="457" r="21" fill="#dcecff"/><text x="225" y="464" text-anchor="middle" fill="#0d3569" font-size="18" font-weight="900">A</text>
    <path d="M258 457H330" fill="none" stroke="#1267b1" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <rect x="346" y="429" width="180" height="56" rx="14" fill="#fff0dd"/>
    <text x="436" y="452" text-anchor="middle" fill="#7b3d05" font-size="19" font-weight="850">Studente</text>
    <text x="436" y="474" text-anchor="middle" fill="#41546d" font-size="15">mittente</text>
    <text x="94" y="528" fill="#172b45" font-size="20" font-weight="800">Riceve la risposta:</text>
    <rect x="94" y="548" width="190" height="40" rx="20" fill="#dcecff"/><text x="189" y="574" text-anchor="middle" fill="#0d3569" font-size="17" font-weight="800">Mittente ✓</text>
    <rect x="298" y="548" width="228" height="40" rx="20" fill="#eef1f4"/><text x="412" y="574" text-anchor="middle" fill="#52657a" font-size="17" font-weight="800">CC e CCN esclusi</text>

    <rect x="630" y="360" width="510" height="270" rx="20" fill="#ffffff" stroke="#21734b" stroke-width="3"/>
    <path d="M650 360h470a20 20 0 0 1 20 20v45H630v-45a20 20 0 0 1 20-20z" fill="#21734b"/>
    <text x="664" y="401" fill="#ffffff" font-size="27" font-weight="850">Rispondi a tutti</text>
    <text x="664" y="464" fill="#15573a" font-size="19" font-weight="800">Docente</text>
    <circle cx="795" cy="457" r="21" fill="#e5f4eb"/><text x="795" y="464" text-anchor="middle" fill="#15573a" font-size="18" font-weight="900">A</text>
    <path d="M828 457H860" fill="none" stroke="#1267b1" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <rect x="876" y="429" width="220" height="56" rx="14" fill="#dcecff"/>
    <text x="986" y="452" text-anchor="middle" fill="#0d3569" font-size="18" font-weight="850">Studente + CC</text>
    <text x="986" y="474" text-anchor="middle" fill="#41546d" font-size="15">destinatari visibili</text>
    <text x="664" y="528" fill="#172b45" font-size="20" font-weight="800">Ricevono la risposta:</text>
    <rect x="664" y="548" width="190" height="40" rx="20" fill="#dcecff"/><text x="759" y="574" text-anchor="middle" fill="#0d3569" font-size="17" font-weight="800">Mittente ✓</text>
    <rect x="868" y="548" width="228" height="40" rx="20" fill="#fff0dd"/><text x="982" y="574" text-anchor="middle" fill="#7b3d05" font-size="17" font-weight="800">CC visibile ✓</text>
    <rect x="738" y="595" width="290" height="28" rx="14" fill="#e5f4eb"/><text x="883" y="615" text-anchor="middle" fill="#15573a" font-size="16" font-weight="850">CCN non incluso</text>
  </g>

  <g font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">
    <rect x="60" y="670" width="1080" height="54" rx="18" fill="#fff0dd" stroke="#ad5708" stroke-width="2"/>
    <circle cx="94" cy="697" r="17" fill="#f6b95f"/><text x="94" y="703" text-anchor="middle" fill="#0d3569" font-size="18" font-weight="900">!</text>
    <text x="126" y="704" fill="#7b3d05" font-size="18" font-weight="850">Se il destinatario in CCN risponde a tutti personalmente, può rendere visibile la propria presenza.</text>
  </g>
</svg>
